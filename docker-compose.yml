# Local development database. Start with: docker compose up -d
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: finasto
      MYSQL_USER: finasto
      MYSQL_PASSWORD: finasto
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
