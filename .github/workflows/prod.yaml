name: Docker Build and Deploy

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "${{ secrets.ENV_FILE_PROD }}" > .env

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: docker build -t radpc/phone-backend .

      - name: Push Docker Image
        run: docker push radpc/phone-backend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{secrets.EC2_USER}}@${{secrets.EC2_HOST}} 'if sudo docker ps -q --filter "status=running" | grep -q .; then sudo docker stop $(sudo docker ps -q --filter "status=running"); fi && if sudo docker ps -a -q | grep -q .; then sudo docker rm $(sudo docker ps -a -q); fi && sudo docker pull radpc/phone-backend && sudo docker run -p 3000:3000 -d radpc/phone-backend && sudo docker image prune -f'
