name: Docker Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo "${{ secrets.ENV_FILE_PROD }}" > .env

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: docker build -t radpc/financeio-backend .

      - name: Push Docker Image
        run: docker push radpc/financeio-backend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: View EC2 PRIVATE KEY
        run: echo "${{secrets.EC2_PRIVATE_KEY}}" > private_key.pem && cat private_key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{secrets.EC2_USER}}@${{secrets.EC2_HOST}} 'if sudo docker ps -q --filter "status=running" | grep -q .; then sudo docker stop $(sudo docker ps -q --filter "status=running"); fi && if sudo docker ps -a -q | grep -q .; then sudo docker rm $(sudo docker ps -a -q); fi && sudo docker pull radpc/financeio-backend && sudo docker run -p 3000:3000 -d radpc/financeio-backend && sudo docker image prune -f'
